# Database project settings (no secrets). Sourced by Build/common.sh.

# Managed schemas, in deployment order. Plans are generated and applied one schema at a time
# (pgschema diffs one schema per run), so a schema whose new objects reference another schema's new
# objects must come after it. Known cross-schema references: app -> app_auth.users,
# app_auth.user_applications -> app.applications (cycle: only an empty database is bootstrapped at once),
# gpp|sjo|rospbu -> app.*, app_auth.users, rospbu -> sjo.erp_systems.
MANAGED_SCHEMAS="app_auth app sjo gpp rospbu"

# Source layout (relative to the repository root)
SOURCE_DIR="postgres"
OBJECT_MANIFEST="postgres/objects.sql"
PREDEPLOY_DIR="postgres/predeploy"
POSTDEPLOY_DIR="postgres/postdeploy"
SQL_TEST_DIR="postgres/tests"
# Demo data loaded into the throw-away build database before the SQL tests (never into a target)
SQL_TEST_SEED="postgres/seed.sql"

# PostgreSQL major version the project is built and tested against (Supabase runs 17)
POSTGRES_MAJOR="17"

# Tool versions the scripts were tested with (checked by Build/common.sh tool_versions)
PGSCHEMA_VERSION="1.14.1"
SQLFLUFF_VERSION="4.4.0"

# Name of the throw-away database created on the build server (BUILD_DB_HOST) for validation and as
# pgschema's plan database. It is dropped and recreated by every build.
BUILD_DB_NAME_DEFAULT="dbproject_build"
